<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Investments Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Shell: header + tab bar; each tab is its own page loaded only when opened (see 13 Architecture). */
:root{
  --paper:#E4E8EC; --panel:#EDF0F3; --ink:#151A21; --ink-2:#4A5560; --ink-3:#7C8792; --rule:#C3CBD3; --rule-2:#D6DCE2;
  --bull:#1D6B4C; --bear:#993030; --hold:#87671C; --hold-bg:#E6DCC4;
  --font:Archivo,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#12171D; --panel:#1A2029; --ink:#E6EBF0; --ink-2:#A3AEB9; --ink-3:#727D88; --rule:#2E3844; --rule-2:#252E38;
  --bull:#5FBF92; --bear:#E07777; --hold:#D4AC4C; --hold-bg:#382F19; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12171D; --panel:#1A2029; --ink:#E6EBF0; --ink-2:#A3AEB9; --ink-3:#727D88; --rule:#2E3844; --rule-2:#252E38;
  --bull:#5FBF92; --bear:#E07777; --hold:#D4AC4C; --hold-bg:#382F19; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--rule)}
.in{max-width:1000px;margin:0 auto;padding-inline:18px;padding-block:10px 0;display:flex;align-items:flex-end;gap:6px 20px;flex-wrap:wrap}
.brand{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding-bottom:10px;display:flex;gap:8px;align-items:center}
.stg{font-size:10.5px;font-weight:800;letter-spacing:.08em;color:var(--hold);border:1.5px solid var(--hold);padding:1px 6px}
nav{display:flex;gap:2px;overflow-x:auto;min-width:0;flex:1}
nav button{font:inherit;font-size:13.5px;font-weight:600;color:var(--ink-2);background:none;border:0;border-bottom:3px solid transparent;
  padding:8px 12px 9px;cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
nav button:hover{color:var(--ink)}
nav button small{font-size:10px;font-weight:700;color:var(--hold);margin-left:5px;letter-spacing:.04em}
nav button:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
iframe{display:block;width:100%;border:0;min-height:600px;background:var(--paper)}
.msg{max-width:1000px;margin:0 auto;padding:30px 18px;color:var(--ink-2)}
</style>
<div class="bar"><div class="in">
  <div class="brand">Investments <span class="stg" id="stg" hidden>Staging</span></div>
  <nav id="tabs" role="tablist" aria-label="Dashboards"></nav>
</div></div>
<main id="panes"><p class="msg">Loading tabs…</p></main>
<script>
/* tabs.json lists the tabs. Adding a stock = one line there; this page never changes for it. */
const panes=document.getElementById('panes'), nav=document.getElementById('tabs'), frames={};
const syncTheme=f=>{try{const t=document.documentElement.getAttribute('data-theme');const r=f.contentDocument&&f.contentDocument.documentElement;if(!r)return;
  t?r.setAttribute('data-theme',t):r.removeAttribute('data-theme')}catch(e){}};
new MutationObserver(()=>Object.values(frames).forEach(syncTheme)).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
let TABS=[];
addEventListener('message',e=>{if(!e.data)return;
  if(e.data.type==='tab-height')for(const f of Object.values(frames))if(f.contentWindow===e.source)f.style.height=(e.data.h+20)+'px';
  if(e.data.type==='open-tab'){const t=TABS.find(x=>x.id===e.data.id);if(t){open(t);scrollTo(0,0)}}});
function open(tab){
  nav.querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected',b.dataset.id===tab.id?'true':'false'));
  Object.entries(frames).forEach(([id,f])=>f.hidden=id!==tab.id);
  if(!frames[tab.id]){const f=document.createElement('iframe');f.title=tab.label+' dashboard';f.src=tab.src;
    f.addEventListener('load',()=>{syncTheme(f);try{f.style.height=(f.contentDocument.documentElement.scrollHeight+20)+'px'}catch(e){}});
    frames[tab.id]=f;panes.appendChild(f);}
  try{localStorage.setItem('inv-tab',tab.id)}catch(e){}
  if(location.hash.slice(1)!==tab.id)history.replaceState(null,'','#'+tab.id);
}
fetch('tabs.json',{cache:'no-store'}).then(r=>r.json()).then(cfg=>{
  panes.innerHTML='';document.getElementById('stg').hidden=cfg.page!=='staging';
  const tabs=cfg.tabs; TABS=tabs;
  nav.innerHTML=tabs.map(t=>`<button role="tab" data-id="${t.id}" aria-selected="false">${t.label}${cfg.page==='staging'&&t.status!=='live'?'<small>NEW</small>':''}</button>`).join('');
  nav.querySelectorAll('button').forEach(b=>b.onclick=()=>open(tabs.find(t=>t.id===b.dataset.id)));
  let want=location.hash.slice(1);if(!want){try{want=localStorage.getItem('inv-tab')}catch(e){}}
  open(tabs.find(t=>t.id===want)||tabs[0]);
}).catch(e=>{panes.innerHTML='<p class="msg">Could not load the tab list (tabs.json). Republish it with the page.</p>'});
</script>

</body></html>
