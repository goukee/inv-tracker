<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stock tab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Shared stock template. Layout: one reading column; summary first (call, score, buckets), then the evidence in plan order.
   Tokens copied from the crypto regime page so every tab looks like one system. */
:root{
  --paper:#E4E8EC; --panel:#EDF0F3; --ink:#151A21; --ink-2:#4A5560; --ink-3:#7C8792;
  --rule:#C3CBD3; --rule-2:#D6DCE2;
  --bull:#1D6B4C; --bear:#993030; --hold:#87671C; --absent:#A7B0B9;
  --bull-bg:#CFE0D6; --bear-bg:#E8D2D2; --hold-bg:#E6DCC4;
  --font:Archivo,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#12171D; --panel:#1A2029; --ink:#E6EBF0; --ink-2:#A3AEB9; --ink-3:#727D88;
    --rule:#2E3844; --rule-2:#252E38;
    --bull:#5FBF92; --bear:#E07777; --hold:#D4AC4C; --absent:#5A646E;
    --bull-bg:#1B3A2C; --bear-bg:#3B2222; --hold-bg:#382F19; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#12171D; --panel:#1A2029; --ink:#E6EBF0; --ink-2:#A3AEB9; --ink-3:#727D88;
  --rule:#2E3844; --rule-2:#252E38;
  --bull:#5FBF92; --bear:#E07777; --hold:#D4AC4C; --absent:#5A646E;
  --bull-bg:#1B3A2C; --bear-bg:#3B2222; --hold-bg:#382F19; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.wrap{max-width:1000px;margin:0 auto;padding-inline:18px;padding-block:18px 56px}
h2{font-size:14px;font-weight:700;margin:34px 0 0;padding-bottom:7px;border-bottom:1px solid var(--ink);text-wrap:balance}
.sub{font-size:13px;color:var(--ink-2);margin:10px 0 12px}
h2{display:flex;justify-content:space-between;align-items:baseline;gap:8px 14px;flex-wrap:wrap}
.chg{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:2px;white-space:nowrap}
.chg.on{color:var(--ink);background:var(--hold-bg);box-shadow:inset 3px 0 0 var(--hold)}
.chg.off{color:var(--ink-3);border:1px solid var(--rule)}
.chglist{list-style:none;margin:8px 0 0;padding:8px 12px;background:var(--hold-bg);font-size:12.5px;color:var(--ink);display:grid;gap:3px}
.chglist li::before{content:"▸ ";color:var(--hold)}
.nl{margin:14px 0 0;padding:10px 13px;border:1px solid var(--hold);background:var(--hold-bg);font-size:13px;color:var(--ink-2)}
.nl b{color:var(--ink)}.nl ul{margin:6px 0 0;padding-left:18px}.nl li{margin-bottom:3px}
.overnight{margin:12px 0 0;padding:10px 13px;border:1px solid var(--rule);background:var(--panel);font-size:13px;color:var(--ink-2);display:flex;gap:6px 14px;flex-wrap:wrap;align-items:baseline}
.overnight b{color:var(--ink)}
.overnight a{color:var(--ink);font-weight:600;text-decoration:underline;text-decoration-color:var(--hold);text-underline-offset:3px}
.pos{color:var(--bull)}.neg{color:var(--bear)}.nil{color:var(--hold)}.abs{color:var(--absent)}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:2px;white-space:nowrap}
.pill.bull{color:var(--bull);background:var(--bull-bg)}.pill.bear{color:var(--bear);background:var(--bear-bg)}
.pill.hold{color:var(--hold);background:var(--hold-bg)}.pill.mute{color:var(--ink-2);border:1px solid var(--rule)}
.stale{margin:14px 0 0;padding:10px 13px;border:1px solid var(--bear);background:var(--bear-bg);font-size:13px;font-weight:600;color:var(--bear)}
.tbl{overflow-x:auto;border-top:1px solid var(--ink)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:7px 9px;text-align:right;border-bottom:1px solid var(--rule-2);white-space:nowrap}
.sh td:first-child{white-space:normal}
.sh .ix{display:block;font-size:10.5px;color:var(--ink-3);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
th:first-child,td:first-child{text-align:left}
thead th{background:var(--panel);color:var(--ink-2);font-weight:600;font-size:11.5px}
tr.me td{font-weight:700;background:var(--hold-bg)}
tr.med td{font-weight:700;border-top:1px solid var(--rule)}
td.dim{color:var(--absent);text-decoration:line-through}

/* masthead */
.mast{display:flex;justify-content:space-between;align-items:baseline;gap:8px 16px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:9px}
.mast h1{font-size:17px;font-weight:700;margin:0;letter-spacing:-.01em}
.mast h1 small{font-size:13px;font-weight:500;color:var(--ink-2);margin-left:6px}
.mast .px{font-size:14px;color:var(--ink-2);font-weight:500}
.mast .px b{color:var(--ink);font-size:17px}
.stg{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--hold);border:1.5px solid var(--hold);padding:1px 6px;margin-left:8px;vertical-align:2px}

/* hero */
.hero{padding:24px 0 0}
.call{font-size:clamp(34px,9vw,56px);font-weight:800;letter-spacing:-.035em;line-height:1;margin:0}
.stamp{display:inline-block;font-size:12.5px;font-weight:700;color:var(--hold);border:1.5px solid var(--hold);padding:2px 8px;margin:10px 0 0}
.lead{font-size:16.5px;font-weight:600;margin:18px 0 12px}
ul.bul{list-style:none;margin:0;padding:0}
ul.bul li{font-size:14.5px;color:var(--ink-2);padding:0 0 11px 16px;position:relative;break-inside:avoid}
ul.bul li::before{content:"";position:absolute;left:0;top:8px;width:6px;height:6px;border-radius:50%;background:var(--ink-3)}
ul.bul li b{color:var(--ink)}
@media (min-width:880px){ul.bul.two{columns:2;column-gap:40px}}

/* score band */
.band{display:grid;grid-template-columns:auto 1fr;gap:14px 26px;align-items:start;margin:22px 0 0;padding:16px 0 0;border-top:1px solid var(--rule)}
.num>span{display:block}
.num .lbl{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:700;display:block}
.num .big{font-size:52px;font-weight:800;letter-spacing:-.04em;line-height:1.02}
.num .scale{font-size:11.5px;color:var(--ink-3)}
.track{position:relative;height:16px;border-radius:2px;overflow:hidden;background:var(--rule-2);margin-top:6px}
.zone{position:absolute;top:0;bottom:0}
.zone.ss,.zone.s{background:var(--bear)}.zone.ss{opacity:.4}.zone.s{opacity:.22}
.zone.h{background:var(--hold);opacity:.2}.zone.b{background:var(--bull);opacity:.22}.zone.sb{background:var(--bull);opacity:.4}
.mark{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--ink);border-radius:2px;box-shadow:0 0 0 2px var(--paper)}
.bandwrap{position:relative}
.ax{position:relative;height:30px;margin-top:5px;font-size:11px;color:var(--ink-3)}
.ax span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.ax span.z{top:14px;font-weight:600;color:var(--ink-2)}
.meta3{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:12px;font-size:12.5px;color:var(--ink-2)}
.meta3 b{color:var(--ink)}
@media (max-width:620px){.band{grid-template-columns:1fr}.num .big{font-size:42px}.ax span.z{display:none}}

.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;background:var(--rule-2);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin-top:22px}
.bk{background:var(--paper);padding:14px}
.bk .nm{font-size:13.5px;font-weight:600}.bk .wt{font-size:12px;color:var(--ink-3);margin:1px 0 8px}
.bk .val{font-size:31px;font-weight:800;letter-spacing:-.03em;line-height:1}
.bk .q{font-size:12.5px;color:var(--ink-2);margin-top:8px}

.flags{margin-top:14px;display:grid;gap:6px}
.flag{border:1px solid var(--rule);background:var(--panel);padding:9px 12px;font-size:13px}
.changers{margin:12px 0 0;padding-left:18px;font-size:13.5px;color:var(--ink-2)}
.changers li{margin-bottom:7px}.changers b{color:var(--ink)}

/* move */
.movegrid>*{min-width:0}
.movegrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px 28px;margin-top:12px}
@media (max-width:760px){.movegrid{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--rule-2);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.kv div{background:var(--paper);padding:9px 10px}
.kv dt{font-size:11px;color:var(--ink-3);margin:0 0 2px}.kv dd{margin:0;font-size:18px;font-weight:700}
.parts svg{width:100%;height:auto;display:block}
.ev{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.ev li{padding:9px 0;border-bottom:1px solid var(--rule-2);font-size:13px;color:var(--ink-2);display:grid;grid-template-columns:52px 1fr;gap:10px}
.ev li .d{font-weight:700;color:var(--ink);font-size:12px}
.ev .src{display:block;font-size:11.5px;color:var(--ink-3);margin-top:2px}
.cal{list-style:none;margin:0;padding:0}
.cal li{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--rule-2);font-size:13px}
.cal .d{font-weight:700}.cal .n{display:block;color:var(--ink-3);font-size:12px}

/* indicators */
.ind{display:grid;grid-template-columns:40px minmax(0,1fr) minmax(0,1.55fr) 118px;gap:6px 18px;padding:13px 6px;border-bottom:1px solid var(--rule-2);align-items:start}
.ind.moved{background:linear-gradient(90deg,var(--hold-bg),transparent 60%);box-shadow:inset 3px 0 0 var(--hold)}
.ind .id{font-size:11.5px;font-weight:700;color:var(--ink-3);padding-top:2px}
.ind .nm{font-weight:700;font-size:14px}.ind .ms{font-size:11.5px;color:var(--ink-3);margin-top:4px;line-height:1.4}
.ind .ex{display:grid;gap:5px;font-size:13px;color:var(--ink-2);line-height:1.45}
.ind .ex span{display:block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.ind .ex .now{color:var(--ink);font-weight:500}
.ind .sc{text-align:right;display:grid;gap:4px;justify-items:end}
.ind .vl{font-weight:700;font-size:13px;text-align:right}
.was{font-size:11px;color:var(--hold);font-weight:700}
.grp{font-size:12px;font-weight:700;color:var(--ink-2);background:var(--panel);padding:7px 8px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.chip{font-size:12px;padding:3px 9px;border-radius:2px;background:var(--panel);border:1px solid var(--rule);color:var(--ink-2)}
.chip b{color:var(--ink)}.chip .u{color:var(--bull);font-weight:700}.chip .d{color:var(--bear);font-weight:700}
@media (max-width:760px){.ind{grid-template-columns:34px minmax(0,1fr) 96px}.ind .ex{grid-column:2 / 4;grid-row:2}}

/* peers */
.peerwhy{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:6px 20px;margin:4px 0 14px;font-size:12.5px;color:var(--ink-2)}
.peerwhy b{color:var(--ink)}
.plain{border-left:3px solid var(--ink);padding:4px 0 4px 14px;margin:14px 0 0;display:grid;gap:8px;font-size:13.5px;color:var(--ink-2)}
.plain b{color:var(--ink)}

/* earnings */
.earn{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px 28px;margin-top:12px}
.ec h3{font-size:14px;margin:0 0 2px}.ec .dt{font-size:12px;color:var(--ink-3);margin-bottom:8px}
.ec p{font-size:13px;color:var(--ink-2);margin:0 0 6px}.ec p b{color:var(--ink)}
.ec ul{margin:6px 0;padding-left:18px;font-size:13px;color:var(--ink-2)}.ec li{margin-bottom:4px}.ec li b{color:var(--ink)}

/* chains */
.chains{display:grid;gap:12px;margin-top:12px}
.chain{border:1px solid var(--rule);background:var(--panel);padding:13px 14px}
.chain .hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.chain h3{font-size:14px;margin:0}
.path{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;margin:8px 0;font-size:12.5px;color:var(--ink-2)}
.path span{background:var(--paper);border:1px solid var(--rule-2);padding:2px 7px;border-radius:2px}
.path i{font-style:normal;color:var(--ink-3)}
.watch{font-size:12.5px;color:var(--ink-2)}.watch b{color:var(--ink)}
.chain ul{margin:8px 0 0;padding-left:18px;font-size:12.5px;color:var(--ink-2)}

/* quality */
.qc{list-style:none;margin:10px 0 0;padding:0;border-top:1px solid var(--rule)}
.qc li{display:grid;grid-template-columns:minmax(200px,1fr) minmax(0,1.4fr);gap:4px 14px;padding:9px 2px;border-bottom:1px solid var(--rule-2);font-size:13px}
.qc .r{font-size:12px;color:var(--ink-3)}
.qc li>span:last-child{text-align:right}
@media (max-width:620px){.qc li>span:last-child{text-align:left}}

/* charts */
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.ch-grid{stroke:var(--rule-2);stroke-width:1}.ch-ax{font-size:10.5px;fill:var(--ink-3);font-family:var(--font)}
.ch-line{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
.ch-area{fill:var(--ink);opacity:.06}
.ch-cross{stroke:var(--ink-3);stroke-dasharray:2 3}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);font-size:12px;padding:5px 8px;border-radius:2px;white-space:nowrap;transform:translate(-50%,-110%)}
.chart{position:relative}

/* revenue mix (plan v0.4; not scored). Series colours: validated categorical palette, 6 slots, light and dark; "Other" is neutral grey */
:root{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s0:#8f99a3}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s0:#6b7580}}
:root[data-theme="dark"]{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s0:#6b7580}
.mixk{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);margin:12px 0}
.mixk>div{background:var(--panel);padding:10px 12px}
.mixk .l{display:block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.mixk .v{display:block;font-size:19px;font-weight:700;margin:3px 0 2px}
.mixk .n{display:block;font-size:12px;color:var(--ink-2)}
.mixbar{display:flex;justify-content:space-between;align-items:center;gap:8px 16px;flex-wrap:wrap;margin:10px 0 6px}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12.5px;color:var(--ink-2)}
.legend i,.sw{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.seg{display:inline-flex;border:1px solid var(--rule)}
.seg button{font:inherit;font-size:12px;font-weight:600;background:none;border:0;padding:5px 10px;color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
#mixc{overflow-x:auto}
@media (max-width:620px){#mixc svg,#fcfc svg,#pc svg,#sc svg,.chart svg{min-width:600px}.chart{overflow-x:auto}.qc li{grid-template-columns:1fr}}
.mixtip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);font-size:12px;padding:7px 9px;border-radius:2px;white-space:nowrap;transform:translate(-50%,0);line-height:1.5;z-index:2}
.mixtip i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.segs{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-top:14px}
.sc2{border:1px solid var(--rule);background:var(--panel);padding:13px 14px;border-top:4px solid var(--c)}
.sc2 h3{font-size:14px;margin:0;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.sc2 h3 span{font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.sc2 .tags{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 2px}
.sc2 p{font-size:13px;color:var(--ink-2);margin:6px 0}
.sc2 p b{color:var(--ink)}
.pn{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:5px;font-size:12.8px;color:var(--ink-2)}
.pn li{display:grid;grid-template-columns:16px 1fr;gap:4px}
.pn li::before{font-weight:800}
.pn.p li::before{content:"+";color:var(--bull)}
.pn.n li::before{content:"−";color:var(--bear)}
.pnh{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-top:10px}
.shift{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:6px 28px;border-left:3px solid var(--ink);padding:4px 0 4px 14px;margin:18px 0 0}
.shift h3{grid-column:1/-1;font-size:14px;margin:0}
.shift .calc{grid-column:1/-1;font-size:12.5px;color:var(--ink-2);border-top:1px solid var(--rule-2);padding-top:8px;margin-top:4px}
.shift .calc ul{margin:4px 0 0;padding-left:0}

.foot{margin-top:34px;padding-top:13px;border-top:1px solid var(--rule);font-size:12px;color:var(--ink-3)}
.foot ul{padding-left:18px;margin:6px 0 12px}.foot li{margin-bottom:4px}
.err{padding:30px 0;font-size:14px;color:var(--bear)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="sub">Loading…</p></div>
<script>
/* Draws one stock tab from stocks/<CODE>/data.json. The code comes from the address fragment, e.g. stock.html#AAPL.
   Every number on the page comes from data.json (principle P11). */
const code=(location.hash||'').replace('#','').toUpperCase();
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pc=(x,d=1)=>x==null?'n/a':(x>0?'+':'')+(x*100).toFixed(d)+'%';
const sg=(x,d=0)=>x==null?'n/a':(x>0?'+':x<0?'−':'')+Math.abs(x).toFixed(d);
const fx=(v,d,u='')=>v==null||isNaN(v)?'n/a':v.toFixed(d)+u;
const tone=v=>v==null?'abs':v>0?'pos':v<0?'neg':'nil';
const spill=s=>s==null?'<span class="pill mute">No data</span>':s>0?'<span class="pill bull">Bullish</span>':s<0?'<span class="pill bear">Bearish</span>':'<span class="pill hold">Neutral</span>';
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dshort=iso=>iso?(+iso.slice(8,10))+' '+MON[+iso.slice(5,7)-1]:'';
const dlong=iso=>iso?dshort(iso)+' '+iso.slice(0,4):'';
const ZONE={SB:'Strong Buy',B:'Buy',H:'Hold',S:'Sell',SS:'Strong Sell'};
const zoneTone=z=>z==='SB'||z==='B'?'pos':z==='S'||z==='SS'?'neg':'nil';

function band(d){
  const L=d.lines, x=v=>((v+100)/200*100);
  const zs=[['ss',-100,L.SS],['s',L.SS,L.S],['h',L.S,L.B],['b',L.B,L.SB],['sb',L.SB,100]];
  const ticks=[-100,L.SS,L.S,0,L.B,L.SB,100];
  const names=[['Strong Sell',(-100+L.SS)/2],['Sell',(L.SS+L.S)/2],['Hold',(L.S+L.B)/2],['Buy',(L.B+L.SB)/2],['Strong Buy',(L.SB+100)/2]];
  return `<div class="bandwrap"><div class="track" role="img" aria-label="Composite score ${d.composite} on a scale from −100 to +100">
    ${zs.map(z=>`<i class="zone ${z[0]}" style="left:${x(z[1])}%;width:${x(z[2])-x(z[1])}%"></i>`).join('')}
    ${d.composite!=null?`<i class="mark" style="left:calc(${x(d.composite)}% - 1.5px)"></i>`:''}</div>

function lineChart(vals,opts){

/* ---- Free cash flow timeline (plan v0.5, S10): quarterly bars (green above zero, red below) + last-12-month line. From SEC filings. */
const bn=(v,d=1)=>v==null?'n/a':(v<0?'−':'')+'$'+(Math.abs(v)/1000).toFixed(d)+'bn';
function fcfChart(c){
  const Q=c.quarters||[]; if(Q.length<2) return '';
  const n=Q.length, W=720, H=230, P={l:52,r:150,t:12,b:26}, pw=W-P.l-P.r, ph=H-P.t-P.b, slot=pw/n, bw=Math.min(24,slot*.66);
  const vals=[...Q.map(q=>q.fcf),...Q.map(q=>q.ttm).filter(v=>v!=null)].map(v=>v/1000);
  let lo=Math.min(0,...vals), hi=Math.max(0,...vals); const raw=(hi-lo)/4, mag=10**Math.floor(Math.log10(raw||1)); const st=[1,2,2.5,5,10].map(f=>f*mag).find(x=>x>=raw)||raw;
  lo=Math.floor(lo/st)*st; hi=Math.ceil(hi/st)*st;
  const Y=v=>P.t+ph*(1-(v-lo)/(hi-lo)), X=i=>P.l+slot*i+slot/2;

  Q.forEach((q,i)=>{const v=q.fcf/1000,y0=Y(0),y1=Y(v);o+=`<rect x="${(X(i)-bw/2).toFixed(1)}" y="${Math.min(y0,y1).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1,Math.abs(y1-y0)).toFixed(1)}" rx="1" fill="var(${v<0?'--bear':'--bull'})" opacity=".55"/>`;
    if(n<=8||(n-1-i)%4===0)o+=`<text class="ch-ax" x="${X(i)}" y="${H-7}" text-anchor="middle">${q.label.slice(0,3)} ${q.label.slice(-2)}</text>`;
    o+=`<rect x="${(P.l+slot*i).toFixed(1)}" y="${P.t}" width="${slot.toFixed(1)}" height="${ph}" fill="transparent" data-fcfi="${i}"/>`});
  const pts=Q.map((q,i)=>q.ttm==null?null:[X(i),Y(q.ttm/1000)]).filter(Boolean);
  if(pts.length>1)o+=`<path d="M${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join('L')}" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linejoin="round" pointer-events="none"/>`;
  const last=Q.at(-1);
  if(last.ttm!=null)o+=`<circle cx="${X(n-1)}" cy="${Y(last.ttm/1000)}" r="3" fill="var(--ink)"/><text class="ch-ax" x="${X(n-1)+10}" y="${Y(last.ttm/1000)+4}" style="font-size:11.5px;fill:var(--ink)"><tspan style="font-weight:700">${bn(last.ttm)}</tspan> last 12 months</text>`;
  o+=`<text class="ch-ax" x="${X(n-1)+10}" y="${(last.ttm!=null&&Math.abs(Y(last.fcf/1000)-Y(last.ttm/1000))<14?Y(last.ttm/1000)+18:Y(last.fcf/1000)+4)}" style="font-size:11.5px;fill:var(--ink-2)"><tspan style="font-weight:700">${bn(last.fcf)}</tspan> latest quarter</text>`;
  return `<div class="chart" id="fcfc" style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Free cash flow by quarter, ${esc(Q[0].label)} to ${esc(last.label)}">${o}</svg><div class="mixtip" id="fcftip" hidden></div></div>`;
}
function fcfHover(c){
  const tip=document.getElementById('fcftip'), svg=document.querySelector('#fcfc svg'); if(!svg||!tip)return;
  svg.querySelectorAll('[data-fcfi]').forEach(r=>{r.addEventListener('pointermove',()=>{const q=c.quarters[+r.dataset.fcfi],b=svg.getBoundingClientRect(),vb=svg.viewBox.baseVal;
    const cx=(r.x.baseVal.value+r.width.baseVal.value/2)/vb.width*b.width;
    tip.innerHTML=`<b>Quarter to ${esc(q.label)}</b><br>Operating cash ${bn(q.ocf,2)}<br>− capital spending ${bn(q.capex,2)}<br>= free cash flow <b>${bn(q.fcf,2)}</b>${q.ttm!=null?'<br>Last 12 months: '+bn(q.ttm):''}`;
    tip.hidden=false;tip.style.left=Math.max(90,Math.min(b.width-90,cx))+'px';tip.style.top='4px'});r.addEventListener('pointerleave',()=>tip.hidden=true)});

function fcfSection(c){

  const per=(c.periods||[]).length?`<div class="tbl"><table><thead><tr><th>Period</th><th>Operating cash</th><th>Capital spending</th><th>Free cash flow</th></tr></thead><tbody>${c.periods.map(p=>`<tr><td>${esc(p.label)}</td><td>${bn(p.ocf)}</td><td>${bn(p.capex)}</td><td class="${p.fcf<0?'neg':'pos'}"><b>${bn(p.fcf)}</b></td></tr>`).join('')}</tbody></table></div><p class="sub">Too few quarterly figures for a timeline yet: the company's filings so far give only these periods.</p>`:'';

/* ---- Revenue mix (plan v0.4). Reads d.mix, built by the engine from SEC filings (US) or entered quarters (other markets). Not scored. */
const mixCol=s=>s.id==='OTHER'?'var(--s0)':`var(--s${(s.slot%6)+1})`;
const mixMoney=(mx,v,d=1)=>v==null?'n/a':(mx.currency==='USD'?'$':mx.currency+' ')+(v/1000).toFixed(d)+'bn';
const p1=(x,d=0)=>x==null?'n/a':x.toFixed(d)+'%';
function mixChart(mx,mode){
  const S=mx.segments, Q=mx.quarters, n=Q.length, W=720, H=250, P={l:48,r:172,t:10,b:26};
  const pw=W-P.l-P.r, ph=H-P.t-P.b, slot=pw/n, bw=Math.min(26,slot*0.72);
  const val=(q,s)=>q.rev[s.id]==null?0:mode==='share'?q.rev[s.id]/q.total*100:q.rev[s.id]/1000;
  let step=25, top=100;
  if(mode!=='share'){const m=Math.max(...Q.map(q=>q.total))/1000, raw=m/4, mag=10**Math.floor(Math.log10(raw));step=[1,2,2.5,5,10].map(f=>f*mag).find(x=>x>=raw);top=Math.ceil(m/step)*step}
  const Y=v=>P.t+ph*(1-v/top);
  const ticks=[];for(let t=0;t<=top+1e-9;t+=step)ticks.push(+t.toFixed(6));
  const fmt=t=>mode==='share'?t+'%':mixMoney(mx,t*1000,t<10&&t%1?1:0);
  let g=ticks.map(t=>`<line class="ch-grid" x1="${P.l}" x2="${P.l+pw}" y1="${Y(t)}" y2="${Y(t)}"/><text class="ch-ax" x="${P.l-6}" y="${Y(t)+3.5}" text-anchor="end">${fmt(t)}</text>`).join('');
  Q.forEach((q,i)=>{let acc=0;const x=P.l+slot*i+(slot-bw)/2;
    S.forEach((s,k)=>{const v=val(q,s),y1=Y(acc+v),y0=Y(acc);acc+=v;const h=Math.max(0,y0-y1-(k<S.length-1?1.5:0));
      if(h>0)g+=`<rect x="${x.toFixed(1)}" y="${y1.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="1" fill="${mixCol(s)}"/>`});
    if(n<=8||(n-1-i)%4===0)g+=`<text class="ch-ax" x="${(x+bw/2).toFixed(1)}" y="${H-7}" text-anchor="middle">${q.label.slice(0,3)} ${q.label.slice(-2)}</text>`;
    g+=`<rect x="${(P.l+slot*i).toFixed(1)}" y="${P.t}" width="${slot.toFixed(1)}" height="${ph}" fill="transparent" data-mixi="${i}"/>`});
  // direct labels at the latest bar, spread so they never overlap (13px apart) and stay inside the plot
  const last=Q[n-1]; let acc=0; const lab=S.map(s=>{const v=val(last,s);const m=Y(acc+v/2);acc+=v;return {s,y:m,v}});
  const gap=13; lab.sort((a,b)=>b.y-a.y);
  for(let k=1;k<lab.length;k++) if(lab[k-1].y-lab[k].y<gap) lab[k].y=lab[k-1].y-gap;
  const over=P.t+6-lab[lab.length-1].y; if(over>0){lab[lab.length-1].y+=over;for(let k=lab.length-2;k>=0;k--) if(lab[k].y-lab[k+1].y<gap) lab[k].y=lab[k+1].y+gap}
  const xl=P.l+slot*(n-1)+(slot+bw)/2+6;
  g+=lab.map(l=>`<text class="ch-ax" x="${xl}" y="${(l.y+3.5).toFixed(1)}" style="font-size:11.5px;fill:var(--ink)"><tspan style="font-weight:700">${mode==='share'?Math.round(l.v)+'%':mixMoney(mx,l.v*1000)}</tspan> ${esc((k=>l.s.name.length>k?l.s.name.slice(0,k-1)+'…':l.s.name)(mode==='share'?24:19))}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(mx.code||'')} revenue by part of the business, ${esc(Q[0].label)} to ${esc(last.label)}">${g}</svg><div class="mixtip" id="mixtip" hidden></div>`;
}
function mixHover(mx){
  const tip=document.getElementById('mixtip'), svg=document.querySelector('#mixc svg'); if(!svg||!tip)return;
  svg.querySelectorAll('[data-mixi]').forEach(r=>{
    r.addEventListener('pointermove',()=>{const i=+r.dataset.mixi,q=mx.quarters[i],b=svg.getBoundingClientRect(),vb=svg.viewBox.baseVal;
      const cx=(r.x.baseVal.value+r.width.baseVal.value/2)/vb.width*b.width;
      tip.innerHTML=`<b>Quarter to ${esc(q.label)}</b> · total ${mixMoney(mx,q.total,2)}<br>`+[...mx.segments].reverse().map(s=>`<i style="background:${mixCol(s)}"></i>${esc(s.name)}: ${mixMoney(mx,q.rev[s.id],2)} (${q.rev[s.id]==null?'n/a':(q.rev[s.id]/q.total*100).toFixed(0)+'%'})`).join('<br>');
      tip.hidden=false;tip.style.left=Math.max(110,Math.min(b.width-110,cx))+'px';tip.style.top='4px'});
    r.addEventListener('pointerleave',()=>tip.hidden=true)});
}
function mixMarginChart(mx){
  const M=mx.margin_series; if(!M||M.labels.length<2) return '';

  const all=[...G.flatMap(g=>g.series),...M.company].filter(v=>v!=null);
  let lo=Math.min(0,...all), hi=Math.max(0,...all); const raw=(hi-lo)/5, mag=10**Math.floor(Math.log10(raw||1)); const st=[1,2,2.5,5,10].map(f=>f*mag).find(x=>x>=raw)||raw; lo=Math.floor(lo/st)*st; hi=Math.ceil(hi/st)*st;
  const X=i=>P.l+(n===1?0:i*pw/(n-1)), Y=v=>P.t+ph*(1-(v-lo)/(hi-lo));

  const path=vs=>vs.map((v,i)=>v==null?null:`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).reduce((a,pt)=>{if(!pt){a.push([]);return a}a[a.length-1].push(pt);return a},[[]]).filter(x=>x.length>1).map(x=>'M'+x.join('L')).join('');

  const lab=lines.map(L=>({L,v:L.v.at(-1),y:L.v.at(-1)==null?null:Y(L.v.at(-1))})).filter(x=>x.y!=null).sort((a,b)=>b.y-a.y);
  for(let k=1;k<lab.length;k++) if(lab[k-1].y-lab[k].y<13) lab[k].y=lab[k-1].y-13;
  o+=lab.map(x=>`<circle cx="${X(n-1)}" cy="${Y(x.v)}" r="3" fill="${x.L.c}"/><text class="ch-ax" x="${X(n-1)+8}" y="${(x.y+3.5).toFixed(1)}" style="font-size:11.5px;fill:var(--ink)"><tspan style="font-weight:700">${x.v.toFixed(0)}%</tspan> ${esc(x.L.name.length>20?x.L.name.slice(0,19)+'…':x.L.name)}</text>`).join('');
  return `<div class="grp" style="margin-top:18px"><span>${esc(mx.basis_word[0].toUpperCase()+mx.basis_word.slice(1))} by part, over time</span><span>${M.span===1?'each point = one quarter':'each point = last 4 quarters to that date'}</span></div>
  <div class="chart" style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(mx.basis_word)} by part over time">${o}</svg></div>
  <p class="sub">Each line shows profit ÷ revenue for that part${M.span===1?' in each quarter':', added up over the 4 quarters to each date, so seasonal swings cancel out'}. Dashed line = whole company on the same basis. ${mx.groups.some(g=>g.segments.length>1)?'Parts the company reports only as a group share one line ('+mx.groups.filter(g=>g.segments.length>1).map(g=>esc(g.name)).join(', ')+').':''}</p>`;
}

    <p><b>Results:</b> ${esc(e.vs)}</p><p><b>Outlook:</b> ${esc(e.guide)}</p><p><b>Reaction:</b> ${esc(e.reaction)}</p>
    <ul>${e.take.map(t=>`<li>${t}</li>`).join('')}</ul><p><b>Impact on the call:</b> ${esc(e.impact)}</p></div>`).join('')}</div>
  <div class="tbl" style="margin-top:14px"><table><thead><tr><th>Next results</th><th>Date</th><th>Status</th><th>Calendar days away</th></tr></thead><tbody>
   ${(E.next||[]).map(n=>`<tr><td>${esc(n.q)}</td><td>${esc(n.date)}</td><td><span class="pill ${n.status==='Confirmed'?'bull':'mute'}">${n.status}</span></td><td>${n.status==='Confirmed'?days(n.iso):'about '+days(n.iso)}</td></tr>`).join('')}</tbody></table></div>
  ${(E.next||[]).length?`<p class="sub"><b>What to watch on ${esc(E.next[0].date)}:</b></p><ul class="bul">${E.next[0].watch.map(w=>`<li>${esc(w)}</li>`).join('')}</ul>`:''}

  ${H('shareholders','Shareholders','sec-sh')}
  <p class="sub">Change is measured against each holder's own previous filing: Adding = up 5% or more; Maintaining = within ±5%; Trimming = down 5% to 50%; Selling out = down more than 50%. Filings for the quarter to ${(()=>{const [mm,dd,yy]=(SH.asof||'').split('/');return yy?dd+' '+MON[+mm-1]+' '+yy:esc(SH.asof)})()}. Not scored.</p>
  <div class="movegrid">
   <div><div class="grp"><span>Top 5 holders</span></div><div class="tbl" style="border-top:0"><table class="sh"><thead><tr><th>Holder</th><th>% of shares outstanding</th><th>Change vs its previous filing</th><th>Class</th></tr></thead><tbody>${SH.top5.map(h=>`<tr><td>${esc(h.disp||mkName(h.name))}${h.index?'<span class="ix">Index fund</span>':''}</td><td>${h.pct==null?'n/a':h.pct.toFixed(2)+'%'}</td><td>${h.chg==null?'n/a':sg(h.chg,1)+'%'}</td><td>${clsPill(h.cls)}</td></tr>`).join('')}</tbody></table></div></div>
   <div><div class="grp"><span>Top 5 active holders</span></div><div class="tbl" style="border-top:0"><table class="sh"><thead><tr><th>Holder</th><th>% of shares outstanding</th><th>Change vs its previous filing</th><th>Class</th></tr></thead><tbody>${SH.active.map(h=>`<tr><td>${esc(h.disp||mkName(h.name))}</td><td>${h.pct==null?'n/a':h.pct.toFixed(2)+'%'}</td><td>${h.chg==null?'n/a':sg(h.chg,1)+'%'}</td><td>${clsPill(h.cls)}</td></tr>`).join('')}</tbody></table></div></div>
  </div>
  <p class="sub"><b>Insiders, last 6 months:</b> ${SH.insiders.some(i=>i.buy_sh>0)?SH.insiders.filter(i=>i.buy_sh>0).length+' bought in the open market.':'no open-market purchases.'} Sales: ${SH.insiders.filter(i=>i.sell_sh>0).map(i=>`${esc(i.name)} (${esc(i.role)}) $${(i.sell_val/1e6).toFixed(1)}m`).join('; ')}. ${SH.insiders.filter(i=>i.buy_sh>0).length>=3?'<span class="pill bull">Insider buying cluster</span>':''}</p>
  ${(SH.notes||[]).length?`<p class="sub">${SH.notes.map(esc).join(' ')}</p>`:''}

  ${H('chains','Macro chains','sec-chain')}
  <p class="sub">The outside events that can move this stock, traced to the part of the business they hit. Watch numbers are checked daily. Chains are not scored; they reach the score through demand, valuation and structural moves.</p>
  <div class="chains">${(d.chains||[]).map(c=>`<div class="chain"><div class="hd"><h3>${c.id} · ${esc(c.name)}</h3><span class="pill ${stTone(c.status)}">${esc(c.status)}</span></div>
    <div class="path">${c.path.map(p=>`<span>${esc(p)}</span>`).join('<i>→</i>')}</div>${chainWatch(c)}
    <ul>${c.evidence.map(e=>`<li>${esc(e)}</li>`).join('')}</ul></div>`).join('')}</div>

  ${H('quality','Quality &amp; cash check','sec-q')}
  <p class="sub">Two or more red flags cap the call at Hold. Today: <b>${d.quality.flags} flag${d.quality.flags===1?'':'s'}</b>. Lines marked Info are shown for context and never count as flags.</p>
  <ul class="qc">${d.quality.checks.map(c=>`<li><span><b>${esc(c.name)}</b><span class="r"> · ${esc(c.rule)}</span></span><span>${esc(c.value)} ${c.flag==null?'<span class="pill mute">Excluded</span>':c.flag?'<span class="pill bear">Flag</span>':'<span class="pill bull">OK</span>'}</span></li>`).join('')}${(d.quality.info||[]).map(c=>`<li><span><b>${esc(c.name)}</b><span class="r"> · ${esc(c.rule)}</span></span><span>${esc(c.value)} <span class="pill mute">Info</span></span></li>`).join('')}</ul>
  ${fcfSection(d.quality.cash)}

  ${H('price',pxTitle,'sec-px')}
  <div class="chart" id="pc">${lineChart(cl,{id:'px',label:'Closing price, last 12 months',fmt:v=>'$'+v,xl:[[0,dshort(d.closes.start)+' '+d.closes.start.slice(2,4)],[cl.length-1,dshort(d.closes.end)]]})}</div>
  <h2 id="sec-hist"><span>Score history</span></h2>
  <div class="chart" id="sc">${lineChart(hs.map(h=>h.comp),{id:'hs',h:140,min:-100,max:100,ticks:[-60,-30,0,30,60],label:'Composite score history',empty:'No score yet: coverage is below the 70% floor, so no composite is calculated.',
     bands:[[-100,d.lines.SS,'--bear',.14],[d.lines.SS,d.lines.S,'--bear',.07],[d.lines.B,d.lines.SB,'--bull',.07],[d.lines.SB,100,'--bull',.14]],
     xl:[[0,dshort(hs[0].d)],...(hs.length>1?[[hs.length-1,dshort(hs.at(-1).d)]]:[])]})}</div>
  <p class="sub">${hs.length} trading day${hs.length===1?'':'s'} recorded so far. History starts on ${dlong(hs[0].d)}.</p>

  <footer class="foot"><b>Known defects &amp; data gaps</b><ul>${d.defects.map(x=>`<li>${esc(x)}</li>`).join('')}${(d.removed||[]).map(r=>`<li>Removed for this stock: ${esc(r.id)}, ${esc(r.reason)}</li>`).join('')}${d.errors.map(e=>`<li>Source error today: ${esc(e)}</li>`).join('')}</ul>
   <b>Sources</b><ul>${d.sources.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>
   Built ${esc(m.built)} · ${esc(m.plan)} · settings v${esc(m.version)} · Analysis, not advice: a rules-based reading of the approved indicators.</footer>`;
  hover('px',cl,i=>'$'+cl[i].toFixed(2));
  if(d.quality.cash)fcfHover(d.quality.cash);
  if(d.mix&&d.mix.quarters){mixHover(d.mix);document.querySelectorAll('[data-mixmode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-mixmode]').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));$('#mixc').innerHTML=mixChart(d.mix,b.dataset.mixmode);mixHover(d.mix);parent!==window&&parent.postMessage({type:'tab-height',h:document.documentElement.scrollHeight},'*')})}
  hover('hs',hs.map(h=>h.comp),i=>dshort(hs[i].d)+': '+sg(hs[i].comp)+(hs[i].call?' · '+ZONE[hs[i].call]:''));
  document.title=m.code+' · '+callLabel;
  parent!==window&&parent.postMessage({type:'tab-height',h:document.documentElement.scrollHeight},'*');
}
if(!code){$('#app').innerHTML='<p class="err">No stock code given. Open this page from the dashboard tabs.</p>'}
else fetch(`../stocks/${code}/data.json`,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(render)
  .catch(e=>{$('#app').innerHTML=`<p class="err">Could not load the data for ${esc(code)} (${esc(e.message)}). The daily refresh may not have published it yet.</p>`});
new ResizeObserver(()=>parent!==window&&parent.postMessage({type:'tab-height',h:document.documentElement.scrollHeight},'*')).observe(document.body);
</script>
</body>
</html>
